# Builds the Windows installer and publishes a GitHub Release when a version tag is pushed:
#   git tag v0.3.0 && git push origin v0.3.0
#
# Required repository secrets (Settings › Secrets and variables › Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   — public values baked into the app
# Optional:
#   VITE_TURN_URLS, VITE_TURN_USERNAME, VITE_TURN_CREDENTIAL
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make sure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Check version matches tag
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/desktop version v$version" >&2
            exit 1
          fi

      - name: Build installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURN_URLS: ${{ secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
        run: npm run dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/PulseLink-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
